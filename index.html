<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:;" />
  <title>Desktop Pet</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- Root scene: transparent, full-window -->
  <div id="scene">

    <!-- ZZZ floating icon (sleep state) -->
    <div id="zzz-container" class="hidden">
      <img id="zzz-img" src="assets/zzz.png" alt="zzz" draggable="false" />
    </div>

    <!-- Speech bubble -->
    <div id="bubble-container" class="hidden">
      <img id="bubble-img" src="assets/message.png" alt="bubble" draggable="false" />
      <span id="bubble-text"></span>
    </div>

    <!-- Pet character (the draggable element) -->
    <div id="pet-wrapper">
      <img id="pet-img" src="assets/stand-still-1.png" alt="pet" draggable="false" />
    </div>

  </div>

  <script src="renderer.js"></script>
</body>
</html>
